<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Baslatici</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<!-- Samsung SEF player arayuzu (Orsay 2012+) -->
	<object id="sefPlayer" style="position:absolute;left:0;top:0;width:0;height:0;"></object>

	<div id="loading" class="hidden">Yukleniyor...</div>

	<!-- Ana baslatici: buyuk karolar -->
	<div id="launcherScene" class="scene">
		<header><h1>EKRAN<span>MERKEZI</span></h1><div class="hint">Ok tuslari: gezin | OK: ac</div></header>
		<div id="tiles">
			<div class="tile" id="tileFilms"><span class="ico">&#127916;</span><span class="t">Filmler<br><small>hdfilmcehennemi</small></span></div>
			<div class="tile" id="tileLive"><span class="ico">&#128225;</span><span class="t">Canli TV<br><small>Turk Top 20</small></span></div>
		</div>
	</div>

	<!-- Film ana ekrani -->
	<div id="homeScene" class="scene hidden">
		<header><button class="backbtn" id="btnHome">&#9664;</button><h1>Film<span>Cehennemi</span></h1></header>
		<div id="homeRows"></div>
	</div>

	<!-- Film detay -->
	<div id="detailScene" class="scene hidden">
		<button class="backbtn" id="btnBack">&#9664; Geri</button>
		<div id="detailBody"></div>
	</div>

	<!-- IPTV liste -->
	<div id="iptvScene" class="scene hidden">
		<header><button class="backbtn" id="btnIptvBack">&#9664;</button><h1>Canli<span>TV</span></h1></header>
		<div id="channelList"></div>
	</div>

	<script src="js/base64.js"></script>
	<script src="js/api.js"></script>
	<script src="js/iptv.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
